<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitoedubounty | Hardware Audit</title>
    <style>
        canvas { position: fixed; top: 0; left: 0; z-index: -1; }
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .terminal {
            width: 95%;
            max-width: 600px;
            border: 2px solid #0f0;
            padding: 20px;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.5);
            background: rgba(0, 10, 0, 0.94);
        }
        .header {
            text-align: center;
            font-weight: bold;
            border-bottom: 2px solid #0f0;
            padding-bottom: 10px;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        .line { margin: 6px 0; font-size: 13px; opacity: 0; animation: fadeIn 0.3s forwards; }
        .warning {
            color: #ff0000;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
            display: none;
            border: 1px solid #ff0000;
            padding: 10px;
            animation: blink 0.8s infinite;
        }
        .footer {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9em;
            border-top: 1px solid #0f0;
            padding-top: 10px;
            display: none;
        }
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="terminal">
    <div class="header">PITOEDUBOUNTY EXPLOIT v9.0</div>
    <div id="logs"></div>
    <div id="warning-msg" class="warning">CİHAZINIZIN KONTROLÜ ELE GEÇİRİLDİ!</div>
    <div id="footer-msg" class="footer">
        <b>Pitoedubounty</b><br>Güvenliğiniz bizim için önemli.
    </div>
</div>

<script>
    // Matrix Arkaplan Efekti
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.height = window.innerHeight; canvas.width = window.innerWidth;
    const chars = "10";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0f0"; ctx.font = fontSize + "px arial";
        drops.forEach((y, i) => {
            const text = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillText(text, i * fontSize, y * fontSize);
            if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 35);

    // Gelişmiş Model Analiz Motoru
    async function getAdvancedModel() {
        const ua = navigator.userAgent;
        const w = window.screen.width;
        const h = window.screen.height;

        // 1. iOS Cihaz Tahmini (Piksel Analizi)
        if (navigator.maxTouchPoints > 2 && /Apple/.test(navigator.vendor)) {
            if (w === 430 && h === 932) return "iPhone 15 Pro Max / 14 Pro Max";
            if (w === 393 && h === 852) return "iPhone 15 Pro / 14 Pro";
            if (w === 428 && h === 926) return "iPhone 14 Plus / 13 Pro Max";
            if (w === 390 && h === 844) return "iPhone 14 / 13 / 13 Pro";
            if (w === 375 && h === 812) return "iPhone 13 mini / 11 Pro / X";
            if (w === 414 && h === 896) return "iPhone 11 / XR / XS Max";
            return "Apple iPhone";
        }

        // 2. Android Client Hints (Modern Tarayıcılar İçin)
        if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
            try {
                const hints = await navigator.userAgentData.getHighEntropyValues(['model']);
                if (hints.model && hints.model !== "") return hints.model;
            } catch (e) {}
        }

        // 3. Klasik Android Yakalama
        const modelMatch = ua.match(/Android.*;\s([^;]+)\sBuild/);
        if (modelMatch && modelMatch[1]) return modelMatch[1];
        
        const altMatch = ua.match(/\(([^;]+);\sAndroid/);
        if (altMatch && altMatch[1]) return altMatch[1];

        // 4. Linux Çekirdek Filtresi (Fallback)
        if (/Linux/.test(ua) && navigator.maxTouchPoints > 0) return "Android Akıllı Cihaz";

        return "Bilinmeyen Cihaz";
    }

    async function start() {
        const logContainer = document.getElementById('logs');
        let ip = "Saptanıyor...";
        try { 
            const r = await fetch('https://api.ipify.org?format=json'); 
            const d = await r.json(); 
            ip = d.ip; 
        } catch(e){ ip = "Proxy/VPN Aktif"; }

        const detectedModel = await getAdvancedModel();

        const logs = [
            `> [!] Hedef Bağlantı: ${ip}`,
            `> [!] Tespit Edilen Model: ${detectedModel}`,
            `> [!] İşlemci Mimarisi: ${navigator.hardwareConcurrency || "8"} Çekirdek`,
            `> [!] Ekran Çözünürlüğü: ${window.screen.width}x${window.screen.height}`,
            `> [!] Sistem Dili: ${navigator.language.toUpperCase()}`,
            `> [!] Bağlantı Tipi: ${navigator.connection ? navigator.connection.effectiveType.toUpperCase() : "MOBİL VERİ"}`,
            "------------------------------------",
            "> [+] Zafiyet Analizi Yapılıyor...",
            "> [!] Veriler Pitoedubounty Sunucusuna Aktarılıyor...",
            "> [+] ERİŞİM BAŞARILI."
        ];

        let i = 0;
        function print() {
            if (i < logs.length) {
                let d = document.createElement('div');
                d.className = 'line';
                d.innerHTML = logs[i];
                logContainer.appendChild(d);
                i++;
                setTimeout(print, 550);
            } else {
                document.getElementById('warning-msg').style.display = 'block';
                document.getElementById('footer-msg').style.display = 'block';
            }
        }
        print();
    }
    window.onload = start;
</script>
</body>
</html>

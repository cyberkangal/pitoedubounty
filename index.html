<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitoedubounty | Hardware Audit</title>
    <style>
        canvas { position: fixed; top: 0; left: 0; z-index: -1; }
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .terminal {
            width: 95%;
            max-width: 600px;
            border: 2px solid #0f0;
            padding: 20px;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.5);
            background: rgba(0, 10, 0, 0.94);
        }
        .header {
            text-align: center;
            font-weight: bold;
            border-bottom: 2px solid #0f0;
            padding-bottom: 10px;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        .line { margin: 6px 0; font-size: 13px; opacity: 0; animation: fadeIn 0.3s forwards; }
        .warning {
            color: #ff0000;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
            display: none;
            border: 1px solid #ff0000;
            padding: 10px;
            animation: blink 0.8s infinite;
        }
        .footer {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9em;
            border-top: 1px solid #0f0;
            padding-top: 10px;
            display: none;
        }
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="terminal">
    <div class="header">PITOEDUBOUNTY EXPLOIT</div>
    <div id="logs"></div>
    <div id="warning-msg" class="warning">CİHAZINIZIN KONTROLÜ ELE GEÇİRİLDİ!</div>
    <div id="footer-msg" class="footer">
        <b>Pitoedubounty</b><br>Güvenliğiniz bizim için önemli.
    </div>
</div>

<script>
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.height = window.innerHeight; canvas.width = window.innerWidth;
    const chars = "10";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0f0"; ctx.font = fontSize + "px arial";
        drops.forEach((y, i) => {
            const text = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillText(text, i * fontSize, y * fontSize);
            if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 35);

    async function getIP() {
        const services = ['https://api.ipify.org?format=json', 'https://ipapi.co/json/'];
        for (let service of services) {
            try {
                const response = await fetch(service);
                const data = await response.json();
                return data.ip || data.query || "Bulunamadı";
            } catch (e) { continue; }
        }
        return "Saptanamadı";
    }

    async function getAdvancedModel() {
        const ua = navigator.userAgent;
        const w = window.screen.width;
        const h = window.screen.height;
        if (navigator.maxTouchPoints > 2 && /Apple/.test(navigator.vendor)) {
            if (w === 390 && h === 844) return "iPhone 14 / 13 / 13 Pro";
            if (w === 430 && h === 932) return "iPhone 15 Pro Max / 14 Pro Max";
            if (w === 393 && h === 852) return "iPhone 15 Pro / 14 Pro";
            return "Apple iPhone";
        }
        if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
            try {
                const hints = await navigator.userAgentData.getHighEntropyValues(['model']);
                if (hints.model) return hints.model;
            } catch (e) {}
        }
        const modelMatch = ua.match(/Android.*;\s([^;]+)\sBuild/);
        if (modelMatch && modelMatch[1]) return modelMatch[1];
        if (/Linux/.test(ua) && navigator.maxTouchPoints > 0) return "Android Cihaz";
        return "Mobil Cihaz";
    }

    async function start() {
        const logContainer = document.getElementById('logs');
        const ip = await getIP();
        const model = await getAdvancedModel();
        
        let batteryInfo = "Erişim Yok";
        let chargeStatus = "Bilinmiyor";
        
        try {
            if (navigator.getBattery) {
                const battery = await navigator.getBattery();
                batteryInfo = `%${Math.round(battery.level * 100)}`;
                chargeStatus = battery.charging ? "ŞARJ EDİLİYOR" : "PRİZDE DEĞİL";
            }
        } catch (e) {}

        const logs = [
            `> [!] Hedef Bağlantı: ${ip}`,
            `> [!] Tespit Edilen Model: ${model}`,
            `> [!] Pil Seviyesi: ${batteryInfo}`,
            `> [!] Enerji Durumu: ${chargeStatus}`,
            `> [!] İşlemci Gücü: ${navigator.hardwareConcurrency || "8"} Thread`,
            `> [!] Çözünürlük: ${window.screen.width}x${window.screen.height}`,
            `> [!] Sistem Dili: ${navigator.language.toUpperCase()}`,
            "------------------------------------",
            "> [+] Zafiyet Analizi Yapılıyor...",
            "> [!] Veriler Pitoedubounty Sunucusuna Aktarılıyor...",
            "> [+] ERİŞİM BAŞARILI."
        ];

        let i = 0;
        function print() {
            if (i < logs.length) {
                let d = document.createElement('div');
                d.className = 'line';
                d.innerHTML = logs[i];
                logContainer.appendChild(d);
                i++;
                setTimeout(print, 500);
            } else {
                document.getElementById('warning-msg').style.display = 'block';
                document.getElementById('footer-msg').style.display = 'block';
            }
        }
        print();
    }
    window.onload = start;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitoedubounty | Deep Exploit</title>
    <style>
        canvas { position: fixed; top: 0; left: 0; z-index: -1; }
        body { background-color: #000; color: #0f0; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .terminal { width: 95%; max-width: 600px; border: 2px solid #0f0; padding: 20px; box-shadow: 0 0 25px rgba(0, 255, 0, 0.5); background: rgba(0, 10, 0, 0.95); }
        .header { text-align: center; font-weight: bold; border-bottom: 2px solid #0f0; padding-bottom: 10px; margin-bottom: 15px; }
        .line { margin: 6px 0; font-size: 13px; opacity: 0; animation: fadeIn 0.3s forwards; }
        .warning { color: #ff0000; font-weight: bold; text-align: center; margin-top: 15px; display: none; border: 1px solid #ff0000; padding: 10px; animation: blink 0.8s infinite; }
        .footer { margin-top: 15px; text-align: center; font-size: 0.9em; border-top: 1px solid #0f0; padding-top: 10px; display: none; }
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="terminal">
    <div class="header">PITOEDUBOUNTY EXPLOIT v8.0</div>
    <div id="logs"></div>
    <div id="warning-msg" class="warning">CİHAZINIZIN KONTROLÜ ELE GEÇİRİLDİ!</div>
    <div id="footer-msg" class="footer"><b>Pitoedubounty</b><br>Güvenliğiniz bizim için önemli.</div>
</div>

<script>
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.height = window.innerHeight; canvas.width = window.innerWidth;
    const chars = "1010110";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);
    function draw() {
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#0f0"; ctx.font = fontSize + "px arial";
        drops.forEach((y, i) => {
            const text = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillText(text, i * fontSize, y * fontSize);
            if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(draw, 35);

    async function getAdvancedModel() {
        const ua = navigator.userAgent;
        
        // 1. Yol: Modern Tarayıcılarda 'Client Hints' (En iyisi bu)
        if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
            try {
                const hints = await navigator.userAgentData.getHighEntropyValues(['model']);
                if (hints.model) return hints.model;
            } catch (e) {}
        }

        // 2. Yol: Klasik User-Agent Analizi
        const modelMatch = ua.match(/\(([^;]+);\sAndroid/);
        if (modelMatch && modelMatch[1] && !modelMatch[1].includes("Linux")) return modelMatch[1];
        
        const buildMatch = ua.match(/Android.*;\s([^;]+)\sBuild/);
        if (buildMatch && buildMatch[1]) return buildMatch[1];

        // 3. Yol: Linux yazıyorsa Android olduğunu kanıtla
        if (/Linux/.test(ua) && navigator.maxTouchPoints > 0) return "Android (Model Gizli)";
        
        return "Bilinmeyen Cihaz";
    }

    async function start() {
        const logContainer = document.getElementById('logs');
        let ip = "Saptanıyor...";
        try { const r = await fetch('https://api.ipify.org?format=json'); const d = await r.json(); ip = d.ip; } catch(e){}

        const model = await getAdvancedModel();
        
        const logs = [
            `> [!] Hedef Bağlantı: ${ip}`,
            `> [!] Tespit Edilen Model: ${model}`,
            `> [!] Çekirdek Sayısı: ${navigator.hardwareConcurrency || "8"} Thread`,
            `> [!] Ekran Çözünürlüğü: ${window.screen.width}x${window.screen.height}`,
            `> [!] Sistem Dili: ${navigator.language.toUpperCase()}`,
            "------------------------------------",
            "> [+] Zafiyet Taraması Tamamlandı.",
            "> [!] Veriler Pitoedubounty Sunucusuna Aktarılıyor...",
            "> [+] ERİŞİM BAŞARILI."
        ];

        let i = 0;
        function print() {
            if (i < logs.length) {
                let d = document.createElement('div');
                d.className = 'line';
                d.innerHTML = logs[i];
                logContainer.appendChild(d);
                i++;
                setTimeout(print, 500);
            } else {
                document.getElementById('warning-msg').style.display = 'block';
                document.getElementById('footer-msg').style.display = 'block';
            }
        }
        print();
    }
    window.onload = start;
</script>
</body>
</html>
